[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architekton"
version = "0.1.0"
description = "Automatic model selection and cost governance for Claude Code"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = ["pyyaml"]

[project.scripts]
architekton = "architekton.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]
